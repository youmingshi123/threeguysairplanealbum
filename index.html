<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>飞机图库</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <section id="gate" aria-labelledby="loginTitle">
    <form id="loginForm" class="panel">
      <h1 id="loginTitle">登录飞机图库</h1>
      <label>用户名<input name="username" autocomplete="username" maxlength="40" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary">登录</button>
    </form>
  </section>
  <div id="app" hidden>
    <header><a class="brand" href="/" aria-label="三溅客的飞机图库首页">
      <img src="/logo.png" alt=""><span>三溅客的飞机图库</span>
    </a><nav aria-label="图库导航">
      <button id="team" aria-pressed="true">团队图库</button>
      <button id="mine" aria-pressed="false">我的图库</button>
    </nav><div class="actions"><strong id="who"></strong>
      <button id="settings">设置</button><button id="logout">退出</button>
    </div></header>
    <main><div class="intro">
      <h1 id="title">团队图库</h1>
      <input id="search" type="search" aria-label="搜索飞机" placeholder="搜索型号、注册号、航司或彩绘">
    </div>
    <p id="count" aria-live="polite"></p><div id="grid"></div></main>
    <button class="primary fab" data-add>＋ 新增飞机</button>
  </div>
  <dialog id="add" aria-labelledby="addTitle"><form id="addForm">
    <div class="bar"><h2 id="addTitle">新增飞机 / 照片</h2><button type="button" data-close>关闭</button></div>
    <label>注册号<input name="reg" maxlength="40" required></label>
    <p id="match" aria-live="polite"></p>
    <fieldset id="details">
      <label>型号<input name="model" maxlength="120" required></label>
      <label>航司<input name="airline" maxlength="120" required></label>
      <label>彩绘（选填）<input name="livery" maxlength="120"></label>
    </fieldset>
    <label>拍摄日期<input name="date" type="date" required></label>
    <label>照片<input name="file" type="file" accept="image/jpeg,image/png,image/webp" required></label>
    <button class="primary">上传并保存</button>
  </form></dialog>
  <dialog id="album" aria-labelledby="albumTitle">
    <div class="bar"><h2 id="albumTitle"></h2><div class="actions">
      <button id="editPlane">编辑飞机信息</button><button id="delPlane" class="danger">删除飞机</button>
      <button data-close>关闭</button></div></div>
    <p id="summary"></p><div id="photos"></div>
  </dialog>
  <dialog id="edit" aria-labelledby="editTitle"><form id="editForm">
    <div class="bar"><h2 id="editTitle">编辑飞机信息</h2><button type="button" data-close>关闭</button></div>
    <label>注册号<input name="reg" maxlength="40" required></label>
    <label>型号<input name="model" maxlength="120" required></label>
    <label>航司<input name="airline" maxlength="120" required></label>
    <label>彩绘（选填）<input name="livery" maxlength="120"></label>
    <button class="primary">保存</button>
  </form></dialog>
  <dialog id="account" aria-labelledby="accountTitle"><form id="accountForm">
    <div class="bar"><h2 id="accountTitle">账号设置</h2><button type="button" data-close>关闭</button></div>
    <label>用户名<input name="newUsername" autocomplete="username" maxlength="40" required></label>
    <label>新密码<input name="newPassword" type="password" autocomplete="new-password"
      minlength="8" maxlength="256" required></label>
    <button class="primary">保存并重新登录</button>
  </form></dialog>
  <div id="notice" role="status" aria-live="polite" popover="manual"></div>
</body>
</html>
